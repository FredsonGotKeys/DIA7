<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>OG Image — Fredson Muianga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital@1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #E9E2D3;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }
  .stage {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 80px;
  }
  .avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: #16332B;
    color: #E9E2D3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    margin-bottom: 32px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    letter-spacing: 6px;
    color: #211A13;
    margin-bottom: 14px;
  }
  p.tagline {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1.7rem;
    color: #55483A;
    margin-bottom: 24px;
  }
  p.footer {
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #93816D;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="avatar">FM</div>
    <h1>FREDSON MUIANGA</h1>
    <p class="tagline">Conselheiro · Consultor · Empresário · Filantropo</p>
    <p class="footer">https://dia-7-roan.vercel.app</p>
  </div>
</body>
</html>
